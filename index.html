<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Store - Account & Ordering Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-black text-white py-4 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center w-full">
            <h1 class="text-xl font-semibold tracking-wide flex items-center gap-2"> Apple Store <span class="text-xs font-normal text-gray-400">| Portal</span></h1>
            <div id="user-nav" class="flex items-center gap-4">
                <!-- Dynamically injected user info / logout button -->
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">

        <!-- SECTION 1: AUTHENTICATION VIEWS (Shown when NOT logged in) -->
        <div id="auth-container" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mt-10">
            <!-- Tabs -->
            <div class="flex border-b mb-6">
                <button onclick="switchTab('login')" id="tab-login" class="w-1/2 pb-3 font-semibold text-black border-b-2 border-black transition">Sign In</button>
                <button onclick="switchTab('register')" id="tab-register" class="w-1/2 pb-3 font-semibold text-gray-400 border-b-2 border-transparent transition">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="login-email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="login-password" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-black text-white py-2.5 rounded-lg font-medium hover:bg-gray-800 transition">Sign In</button>
                <div id="login-msg" class="text-sm text-center font-medium hidden"></div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="space-y-4 hidden">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                        <input type="text" id="reg-firstname" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                        <input type="text" id="reg-lastname" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="reg-email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="reg-password" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                    <input type="text" id="reg-phone" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-black text-white py-2.5 rounded-lg font-medium hover:bg-gray-800 transition">Create Account</button>
                <div id="reg-msg" class="text-sm text-center font-medium hidden"></div>
            </form>
        </div>

        <!-- SECTION 2: STORE & DASHBOARD (Shown when LOGGED IN) -->
        <div id="dashboard-container" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Place Order Form -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 lg:col-span-1 h-fit">
                <h2 class="text-lg font-semibold mb-4 text-gray-800">Place New Order</h2>
                <form id="order-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Logged in as:</label>
                        <input type="text" id="display-customer" readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600 font-medium">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Select iPhone Model</label>
                        <select id="product_select" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none bg-white">
                            <option value="">Loading products...</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Quantity</label>
                        <input type="number" id="quantity" required value="1" min="1" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Total Amount ($)</label>
                        <input type="number" step="0.01" id="total_amount" required readonly class="w-full px-3 py-2 bg-gray-100 border rounded-lg text-gray-600">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Shipping Address</label>
                        <textarea id="shipping_address" required rows="3" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:outline-none">1 Apple Park Way, Cupertino, CA</textarea>
                    </div>

                    <button type="submit" class="w-full bg-black text-white py-2.5 rounded-lg font-medium hover:bg-gray-800 transition">Submit Order</button>
                </form>
                <div id="order-msg" class="mt-4 text-sm text-center font-medium hidden"></div>
            </section>

            <!-- Right: Orders Dashboard Table -->
            <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 lg:col-span-2 overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-gray-800">Live Orders Dashboard</h2>
                    <button onclick="loadOrders()" class="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-medium">Refresh</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b text-xs font-semibold text-gray-500 uppercase bg-gray-50">
                                <th class="p-3">ID</th>
                                <th class="p-3">Customer</th>
                                <th class="p-3">Item</th>
                                <th class="p-3">Qty</th>
                                <th class="p-3">Total</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Date</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y text-sm">
                            <tr><td colspan="7" class="p-6 text-center text-gray-400">Loading orders...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        const API = 'http://localhost:3000/api';
        let currentUser = JSON.parse(localStorage.getItem('apple_user')) || null;

        // Check authentication state on page load
        function initApp() {
            if (currentUser) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard-container').classList.remove('hidden');
                document.getElementById('display-customer').value = `${currentUser.first_name} ${currentUser.last_name} (ID: ${currentUser.customer_id})`;
                document.getElementById('user-nav').innerHTML = `
                    <span class="text-sm text-gray-300">Hello, ${currentUser.first_name}</span>
                    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">Logout</button>
                `;
                loadProducts();
                loadOrders();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('dashboard-container').classList.add('hidden');
                document.getElementById('user-nav').innerHTML = `<span class="text-xs text-gray-400">Please sign in</span>`;
            }
        }

        // Tab Switcher for Login / Register
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = 'w-1/2 pb-3 font-semibold text-black border-b-2 border-black transition';
                tabReg.className = 'w-1/2 pb-3 font-semibold text-gray-400 border-b-2 border-transparent transition';
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = 'w-1/2 pb-3 font-semibold text-black border-b-2 border-black transition';
                tabLogin.className = 'w-1/2 pb-3 font-semibold text-gray-400 border-b-2 border-transparent transition';
            }
        }

        // Register Handler
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('reg-msg');
            const payload = {
                first_name: document.getElementById('reg-firstname').value,
                last_name: document.getElementById('reg-lastname').value,
                email: document.getElementById('reg-email').value,
                password: document.getElementById('reg-password').value,
                phone: document.getElementById('reg-phone').value
            };

            try {
                const res = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                msg.classList.remove('hidden');
                if (res.ok) {
                    msg.className = 'text-sm text-center font-medium text-green-600';
                    msg.textContent = 'Account created! Please sign in.';
                    setTimeout(() => switchTab('login'), 1500);
                } else {
                    msg.className = 'text-sm text-center font-medium text-red-600';
                    msg.textContent = data.error;
                }
            } catch (err) {
                console.error(err);
            }
        });

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('login-msg');
            const payload = {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            };

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                msg.classList.remove('hidden');
                if (res.ok) {
                    localStorage.setItem('apple_user', JSON.stringify(data.customer));
                    currentUser = data.customer;
                    initApp();
                } else {
                    msg.className = 'text-sm text-center font-medium text-red-600';
                    msg.textContent = data.error;
                }
            } catch (err) {
                console.error(err);
            }
        });

        // Logout Handler
        function logout() {
            localStorage.removeItem('apple_user');
            currentUser = null;
            initApp();
        }

        // Load Products into Dropdown
        async function loadProducts() {
            try {
                const res = await fetch(`${API}/products`);
                const result = await res.json();
                const select = document.getElementById('product_select');
                select.innerHTML = result.data.map(p => `
                    <option value="${p.product_id}" data-price="${p.price}">
                        ${p.model_name} (${p.storage_capacity} - ${p.color}) — $${p.price}
                    </option>
                `).join('');
                updateTotal();
            } catch (err) { console.error(err); }
        }

        function updateTotal() {
            const select = document.getElementById('product_select');
            const opt = select.options[select.selectedIndex];
            if (!opt) return;
            const price = parseFloat(opt.getAttribute('data-price')) || 0;
            const qty = parseInt(document.getElementById('quantity').value) || 1;
            document.getElementById('total_amount').value = (price * qty).toFixed(2);
        }

        document.getElementById('product_select').addEventListener('change', updateTotal);
        document.getElementById('quantity').addEventListener('input', updateTotal);

        // Load Orders
        async function loadOrders() {
            try {
                const res = await fetch(`${API}/orders`);
                const result = await res.json();
                const tbody = document.getElementById('orders-table-body');
                if (!result.success || result.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">No orders found.</td></tr>`;
                    return;
                }
                tbody.innerHTML = result.data.map(o => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 font-semibold text-gray-600">#${o.order_id}</td>
                        <td class="p-3">
                            <div class="font-medium">${o.customer_name}</div>
                            <div class="text-xs text-gray-400">${o.customer_email}</div>
                        </td>
                        <td class="p-3 font-medium">${o.item_ordered}</td>
                        <td class="p-3">${o.quantity}</td>
                        <td class="p-3 font-semibold">$${Number(o.total_amount).toFixed(2)}</td>
                        <td class="p-3"><span class="px-2.5 py-1 text-xs rounded-full font-medium bg-yellow-100 text-yellow-700">${o.order_status}</span></td>
                        <td class="p-3 text-xs text-gray-500">${new Date(o.order_date).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            } catch (err) { console.error(err); }
        }

        // Place Order Form Submission
        document.getElementById('order-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('order-msg');
            const payload = {
                customer_id: currentUser.customer_id,
                product_id: parseInt(document.getElementById('product_select').value),
                quantity: parseInt(document.getElementById('quantity').value),
                total_amount: parseFloat(document.getElementById('total_amount').value),
                shipping_address: document.getElementById('shipping_address').value
            };

            try {
                const res = await fetch(`${API}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                msg.classList.remove('hidden');
                if (res.ok) {
                    msg.className = 'mt-4 text-sm text-center text-green-600 font-medium';
                    msg.textContent = '🎉 Order placed successfully!';
                    loadOrders();
                } else {
                    msg.className = 'mt-4 text-sm text-center text-red-600 font-medium';
                    msg.textContent = data.error;
                }
            } catch (err) { console.error(err); }
        });

        // Run on load
        initApp();
    </script>
</body>
</html>
